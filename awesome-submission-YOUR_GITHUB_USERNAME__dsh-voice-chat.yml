# Awesome DSH Plugin 投稿条目
# 用法：
#   1. 把本文件重命名为  data/plugins/<你的GitHub用户名>__dsh-voice-chat.yml
#   2. 替换 url / name 里的 YOUR_GITHUB_USERNAME 为真实用户名
#   3. 若发布过 GitHub Release 且附带 .tgz 安装包，可加 tarball 字段
#      （不发布 tarball 也行，列表与 dsh plugin add 都支持直接装 npm 包）
url: https://github.com/YOUR_GITHUB_USERNAME/dsh-voice-chat
name: YOUR_GITHUB_USERNAME/dsh-voice-chat
category: voice
description:
  zh: "豆包式语音对话插件：聊天框麦克风按钮（按住说话）语音转文字并自动发送，AI 回复自动朗读。可选 LLM 转述精简（长回复先压缩成口语再播，跟随当前对话模型）、朗读前清洗 markdown/emoji/特殊符号、Edge TTS 多种音色、静音自动结束时长可调，设置嵌入 DSH 自带设置弹窗（voice chat 类目）。"
  en: "Doubao-style voice chat for DSH: press-and-hold mic in the composer converts speech to text and auto-sends, and AI replies are read aloud. Optional LLM condensing (long replies are summarized into short spoken lines, following the current conversation model), TTS-friendly text cleaning (markdown/emoji/symbols stripped), selectable Edge TTS voices, adjustable silence auto-stop, and settings embedded into DSH's own settings dialog (voice chat section)."